<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechCanon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .procedure-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .step {
      border-left: 4px solid #111827;
      padding-left: 15px;
      margin: 20px 0;
    }

    .step-number {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .step-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .page-info {
      color: #6b7280;
      margin-bottom: 12px;
    }

    img {
      width: 100%;
      max-width: 800px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      margin-top: 12px;
    }

    .navigation {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .navigation button {
      flex: 1;
    }

    .sources {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    .source {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .warning {
      background: #fff7ed;
      color: #9a3412;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 15px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TechCanon</h1>
  <div class="subtitle">
    Assistant technique Canon
  </div>

  <div class="card">

    <label for="modele">Modèle</label>

    <select id="modele">
      <option value="C1538P">C1538P</option>
      <option value="C1533P">C1533P</option>
      <option value="LBP1538C">LBP1538C</option>
    </select>

    <label for="question">Question</label>

    <textarea
      id="question"
      placeholder="Exemple : Comment démonter la carte de contrôleur CC UN2 ?"
    ></textarea>

    <button id="searchButton" type="button">
      Rechercher
    </button>

    <div id="status"></div>

  </div>

  <div id="resultCard" class="card hidden">

    <div id="resultContent"></div>

  </div>

</div>

<script>

const API_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";

const searchButton =
  document.getElementById("searchButton");

const modeleInput =
  document.getElementById("modele");

const questionInput =
  document.getElementById("question");

const statusBox =
  document.getElementById("status");

const resultCard =
  document.getElementById("resultCard");

const resultContent =
  document.getElementById("resultContent");


let steps = [];
let currentStep = 0;


function afficherStatus(message, type = "") {

  statusBox.className = type;

  statusBox.textContent = message;

}


function afficherErreur(message) {

  statusBox.className = "error";

  statusBox.textContent = message;

}


function afficherProcedure(data) {

  resultCard.classList.remove("hidden");

  const reponse = data.reponse;

  if (!reponse) {

    resultContent.innerHTML = `
      <div class="error">
        Aucune réponse exploitable reçue.
      </div>
    `;

    return;
  }


  if (reponse.type !== "PROCEDURE") {

    resultContent.innerHTML = `
      <div class="procedure-title">
        Information trouvée
      </div>

      <div class="success">
        ${reponse.reference || reponse.message || data.reponse || ""}
      </div>
    `;

    return;
  }


  steps = [];


  if (Array.isArray(reponse.preparatifs)) {

    reponse.preparatifs.forEach((item) => {

      steps.push({
        titre: item.titre,
        page_manuel: item.page_manuel,
        page_pdf: item.page_pdf,
        image: null
      });

    });

  }


  if (reponse.procedure) {

    steps.push({

      titre: reponse.procedure.titre,

      page_manuel:
        reponse.procedure.page_manuel,

      page_pdf:
        reponse.procedure.page_pdf,

      image:
        reponse.procedure.image

    });

  }


  currentStep = 0;


  resultContent.innerHTML = `

    <div class="procedure-title">
      ${reponse.procedure
        ? reponse.procedure.titre
        : "Procédure"}
    </div>

    <div>
      <strong>Modèle :</strong>
      ${data.modele}
    </div>

    <div>
      <strong>Composant :</strong>
      ${reponse.composant || ""}
    </div>

    <div>
      <strong>Unité :</strong>
      ${reponse.unite || ""}
    </div>

    <div class="warning">
      Vérifier les vis, connecteurs et illustrations
      directement dans le Service Manual avant toute intervention.
    </div>

    <div id="stepContainer"></div>

    <div class="navigation">

      <button
        id="previousButton"
        type="button"
      >
        ← Précédent
