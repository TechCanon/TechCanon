<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TechCanon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .primary {
      background: #1a73e8;
      color: white;
    }

    .secondary {
      background: #e8eaed;
      color: #202124;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fde7e9;
      color: #b00020;
    }

    .status.success {
      background: #e6f4ea;
      color: #137333;
    }

    .status.info {
      background: #e8f0fe;
      color: #174ea6;
    }

    .result {
      margin-top: 20px;
    }

    .result h2 {
      margin-top: 0;
    }

    .response-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .response-text {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    .identification-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .info-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      background: #fafafa;
    }

    .info-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: bold;
    }

    .page-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fff;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 17px;
      font-weight: bold;
    }

    .page-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef2f7;
      color: #333;
      font-size: 12px;
      font-weight: bold;
    }

    .page-source {
      white-space: pre-line;
      color: #555;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .manual-page-image-wrapper {
      margin-top: 14px;
      text-align: center;
    }

    .manual-page-image {
      display: block;
      max-width: 100%;
      max-height: 750px;
      margin: 0 auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      object-fit: contain;
      background: #f7f7f7;
    }

    .image-link {
      display: inline-block;
      margin-top: 8px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
    }

    .procedure-card {
      border-left: 5px solid #1a73e8;
      background: #f8fbff;
      border-radius: 10px;
      padding: 18px;
      margin-top: 16px;
    }

    .procedure-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .procedure-pages {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .journey {
      margin-top: 15px;
    }

    .journey-step {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      align-items: flex-start;
    }

    .journey-number {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      background: #1a73e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .journey-content {
      background: white;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 10px 12px;
      flex: 1;
    }

    .journey-title {
      font-weight: bold;
    }

    .journey-page {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .warning {
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      background: #fff4e5;
      color: #8a4b00;
      line-height: 1.5;
    }

    .technical-data {
      margin-top: 20px;
    }

    .technical-data pre {
      background: #f3f4f6;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hidden {
      display: none !important;
    }

    .upload-result {
      margin-top: 12px;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .identification-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .identification-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>TechCanon</h1>
    <p class="subtitle">Assistant technique Service Manual Canon</p>

    <label for="modele">Modèle</label>

    <select id="modele">
      <option value="C1538P">C1538P</option>
      <option value="C1533P">C1533P</option>
      <option value="LBP1538C">LBP1538C</option>
    </select>

    <br><br>

    <label for="question">Question technique</label>

    <textarea
      id="question"
      placeholder="Exemple : où se trouve la carte contrôleur principale ?"
    ></textarea>

    <div class="button-row">
      <button
        id="btnRecherche"
        class="primary"
        onclick="rechercher()"
      >
        Rechercher dans le Service Manual
      </button>
    </div>

    <div id="status" class="status"></div>
  </div>


  <div id="resultat" class="card result hidden">
    <h2>Résultats du Service Manual</h2>

    <div id="contenuReponse"></div>
  </div>


  <div class="card">
    <h2>Ajouter un PV</h2>

    <input
      type="file"
      id="fichierPV"
      accept=".pdf,.png,.jpg,.jpeg"
    >

    <div class="button-row">
      <button
        id="btnUpload"
        class="secondary"
        onclick="envoyerPV()"
      >
        Envoyer le PV
      </button>
    </div>

    <div id="uploadResult" class="upload-result"></div>
  </div>

</div>


<script>

const ANSWER_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";

const UPLOAD_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/upload-pv";


function echapperHTML(valeur) {

  if (valeur === null || valeur === undefined) {
    return "";
  }

  return String(valeur)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function valeurTexte(valeur, valeurDefaut = "") {

  if (
    valeur === null ||
    valeur === undefined
  ) {
    return valeurDefaut;
  }

  if (typeof valeur === "string") {
    return valeur;
  }

  if (
    typeof valeur === "number" ||
    typeof valeur === "boolean"
  ) {
    return String(valeur);
  }

  if (typeof valeur === "object") {

    if (valeur.texte !== undefined) {
      return valeurTexte(valeur.texte);
    }

    if (valeur.reponse !== undefined) {
      return valeurTexte(valeur.reponse);
    }

    if (valeur.message !== undefined) {
      return valeurTexte(valeur.message);
    }

    if (valeur.description !== undefined) {
      return valeurTexte(valeur.description);
    }

    try {
      return JSON.stringify(valeur, null, 2);
    } catch (e) {
      return "";
    }
  }

  return String(valeur);
}


function obtenirDonneesReponse(data) {

  if (
    data &&
    data.reponse &&
    typeof data.reponse === "object"
  ) {
    return data.reponse;
  }

  return data || {};
}


function obtenirTypeReponse(data) {

  const payload = obtenirDonneesReponse(data);

  if (
    payload.intention &&
    String(payload.intention).toUpperCase() === "LOCALISATION"
  ) {
    return "LOCALISATION";
  }

  if (
    payload.type &&
    typeof payload.type === "string"
  ) {
    return payload.type.toUpperCase();
  }

  if (
    data &&
    data.type &&
    typeof data.type === "string"
  ) {
    return data.type.toUpperCase();
  }

  return "";
}


function afficherStatus(message, type = "info") {

  const status = document.getElementById("status");

  status.className = "status show " + type;
  status.textContent = message;
}


function masquerStatus() {

  const status = document.getElementById("status");

  status.className = "status";
  status.textContent = "";
}


function afficherIdentification(identification) {

  if (!identification) {
    return "";
  }

  return `
    <div class="section-title">
      Identification
    </div>

    <div class="identification-grid">

      <div class="info-box">
        <div class="info-label">
          Composant
        </div>

        <div class="info-value">
          ${echapperHTML(
            valeurTexte(identification.composant, "—")
          )}
        </div>
      </div>


      <div class="info-box">
        <div class="info-label">
          Unité
        </div>

        <div class="info-value">
          ${echapperHTML(
            valeurTexte(identification.unite, "—")
          )}
        </div>
      </div>


      <div class="info-box">
        <div class="info-label">
          Page manuel
        </div>

        <div class="info-value">
          ${echapperHTML(
            valeurTexte(identification.page_manuel, "—")
          )}
        </div>
      </div>


      <div class="info-box">
        <div class="info-label">
          Page PDF
        </div>

        <div class="info-value">
          ${echapperHTML(
            valeurTexte(identification.page_pdf, "—")
          )}
        </div>
      </div>

    </div>
  `;
}


function afficherPagesManuel(localisation) {

  if (
    !localisation ||
    !Array.isArray(localisation.pages) ||
    localisation.pages.length === 0
  ) {
    return "";
  }

  let html = `
    <div class="section-title">
      Localisation dans le Service Manual
    </div>
  `;

  localisation.pages.forEach((page, index) => {

    const pageManuel =
      valeurTexte(page.page_manuel, "—");

    const pagePdf =
      valeurTexte(page.page_pdf, "—");

    const titre =
      valeurTexte(
        page.titre,
        "Page du Service Manual"
      );

    const source =
      valeurTexte(page.source, "");

    const image =
      valeurTexte(page.image, "");

    html += `
      <div class="page-card">

        <div class="page-header">

          <div class="page-title">
            ${index + 1}. ${echapperHTML(titre)}
          </div>

          <div class="page-badges">

            <span class="badge">
              Page manuel ${echapperHTML(pageManuel)}
            </span>

            <span class="badge">
              PDF ${echapperHTML(pagePdf)}
            </span>

          </div>

        </div>
    `;

    if (source) {

      html += `
        <div class="page-source">
          ${echapperHTML(source)}
        </div>
      `;
    }


    if (image) {

      const imageSecurisee =
        echapperHTML(image);

      html += `
        <div class="manual-page-image-wrapper">

          <img
            class="manual-page-image"
            src="${imageSecurisee}"
            alt="${echapperHTML(titre)}"
            loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
          >

          <div class="hidden">
            Impossible d'afficher cette image.
          </div>

          <a
            class="image-link"
            href="${imageSecurisee}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Ouvrir l'image en grand
          </a>

        </div>
      `;
    }

    html += `
      </div>
    `;
  });

  return html;
}


function afficherProcedurePrincipale(procedure) {

  if (!procedure) {
    return "";
  }

  const pageManuel =
    valeurTexte(procedure.page_manuel, "—");

  const pagePdf =
    valeurTexte(procedure.page_pdf, "—");

  const titre =
    valeurTexte(
      procedure.titre,
      "Procédure de dépose"
    );

  let html = `
    <div class="section-title">
      Intervention / dépose
    </div>

    <div class="procedure-card">

      <div class="procedure-title">
        ${echapperHTML(titre)}
      </div>

      <div class="procedure-pages">

        <span class="badge">
          Page manuel ${echapperHTML(pageManuel)}
        </span>

        <span class="badge">
          PDF ${echapperHTML(pagePdf)}
        </span>

      </div>
  `;


  if (
    Array.isArray(procedure.preparatifs) &&
    procedure.preparatifs.length > 0
  ) {

    html += `
      <div class="journey">

        <strong>
          Prérequis à effectuer dans l'ordre
        </strong>
    `;

    procedure.preparatifs.forEach(
      (preparatif, index) => {

        const titrePreparatif =
          valeurTexte(
            preparatif.titre,
            "Préparation"
          );

        const pagePreparatif =
          valeurTexte(
            preparatif.page_manuel,
            "—"
          );

        const pdfPreparatif =
          valeurTexte(
            preparatif.page_pdf,
            "—"
          );

        html += `
          <div class="journey-step">

            <div class="journey-number">
              ${index + 1}
            </div>

            <div class="journey-content">

              <div class="journey-title">
                ${echapperHTML(titrePreparatif)}
              </div>

              <div class="journey-page">
                Page manuel ${echapperHTML(pagePreparatif)}
                · PDF ${echapperHTML(pdfPreparatif)}
              </div>

            </div>

          </div>
        `;
      }
    );

    const numeroProcedure =
      procedure.preparatifs.length + 1;

    html += `
        <div class="journey-step">

          <div class="journey-number">
            ${numeroProcedure}
          </div>

          <div class="journey-content">

            <div class="journey-title">
              ${echapperHTML(titre)}
            </div>

            <div class="journey-page">
              Page manuel ${echapperHTML(pageManuel)}
              · PDF ${echapperHTML(pagePdf)}
            </div>

          </div>

        </div>

      </div>
    `;
  }


  /*
   * Si le backend fournit ultérieurement
   * procedure.etapes, elles seront affichées ici.
   */
  if (
    Array.isArray(procedure.etapes) &&
    procedure.etapes.length > 0
  ) {

    html += `
      <div class="section-title">
        Étapes de dépose
      </div>
    `;

    procedure.etapes.forEach(
      (etape, index) => {

        const titreEtape =
          valeurTexte(
            etape.titre,
            `Étape ${index + 1}`
          );

        const description =
          valeurTexte(
            etape.description,
            ""
          );

        const pageEtape =
          valeurTexte(
            etape.page_manuel,
            ""
          );

        html += `
          <div class="journey-step">

            <div class="journey-number">
              ${index + 1}
            </div>

            <div class="journey-content">

              <div class="journey-title">
                ${echapperHTML(titreEtape)}
              </div>

              ${
                description
                  ? `
                    <div style="margin-top:6px; line-height:1.5;">
                      ${echapperHTML(description)}
                    </div>
                  `
                  : ""
              }

              ${
                pageEtape
                  ? `
                    <div class="journey-page">
                      Page manuel
                      ${echapperHTML(pageEtape)}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>
        `;
      }
    );
  }


  html += `
      </div>
    </div>
  `;

  return html;
}


function afficherLocalisation(data) {

  const payload =
    obtenirDonneesReponse(data);

  let html = "";

  const titre =
    valeurTexte(
      payload.titre,
      "Localisation"
    );

  const reponse =
    valeurTexte(
      payload.reponse,
      ""
    );

  html += `
    <div class="response-title">
      ${echapperHTML(titre)}
    </div>
  `;


  if (reponse) {

    html += `
      <div class="response-text">
        ${echapperHTML(reponse)}
      </div>
    `;
  }


  html += afficherIdentification(
    payload.identification
  );


  if (
    payload.localisation &&
    payload.localisation.description
  ) {

    html += `
      <div class="section-title">
        Où se trouve la carte ?
      </div>

      <div class="response-text">
        ${echapperHTML(
          valeurTexte(
            payload.localisation.description
          )
        )}
      </div>
    `;
  }


  html += afficherPagesManuel(
    payload.localisation
  );


  html += afficherProcedurePrincipale(
    payload.procedure
  );


  if (payload.avertissement) {

    html += `
      <div class="warning">
        <strong>Important :</strong><br>
        ${echapperHTML(
          valeurTexte(payload.avertissement)
        )}
      </div>
    `;
  }


  return html;
}


function afficherReponseTechnique(data) {

  const payload =
    obtenirDonneesReponse(data);

  let html = "";

  const titre =
    valeurTexte(
      payload.titre,
      "Réponse technique"
    );

  const reponse =
    valeurTexte(
      payload.reponse,
      payload.message || ""
    );


  html += `
    <div class="response-title">
      ${echapperHTML(titre)}
    </div>
  `;


  if (reponse) {

    html += `
      <div class="response-text">
        ${echapperHTML(reponse)}
      </div>
    `;
  }


  if (payload.identification) {

    html += afficherIdentification(
      payload.identification
    );
  }


  if (payload.procedure) {

    html += afficherProcedurePrincipale(
      payload.procedure
    );
  }


  return html;
}


function afficherReponseGenerique(data) {

  const payload =
    obtenirDonneesReponse(data);

  let texte = "";


  if (payload.reponse) {

    texte =
      valeurTexte(payload.reponse);
  }
  else if (payload.message) {

    texte =
      valeurTexte(payload.message);
  }
  else if (payload.answer) {

    texte =
      valeurTexte(payload.answer);
  }
  else {

    texte =
      valeurTexte(payload);
  }


  return `
    <div class="response-text">
      ${echapperHTML(texte)}
    </div>
  `;
}


function afficherReponse(data) {

  const resultat =
    document.getElementById("resultat");

  const contenu =
    document.getElementById("contenuReponse");


  resultat.classList.remove("hidden");


  const type =
    obtenirTypeReponse(data);


  if (type === "LOCALISATION") {

    contenu.innerHTML =
      afficherLocalisation(data);

    return;
  }


  if (
    type === "REPONSE_TECHNIQUE" ||
    type === "TECHNIQUE" ||
    type === "PROCEDURE"
  ) {

    contenu.innerHTML =
      afficherReponseTechnique(data);

    return;
  }


  contenu.innerHTML =
    afficherReponseGenerique(data);
}


async function rechercher() {

  const modele =
    document.getElementById("modele").value;

  const question =
    document.getElementById("question").value.trim();

  const bouton =
    document.getElementById("btnRecherche");


  if (!question) {

    afficherStatus(
      "Veuillez saisir une question technique.",
      "error"
    );

    return;
  }


  bouton.disabled = true;

  afficherStatus(
    "Recherche dans le Service Manual...",
    "info"
  );


  document
    .getElementById("resultat")
    .classList.add("hidden");


  try {

    const response =
      await fetch(
        ANSWER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            modele: modele,
            question: question
          })
        }
      );


    const texte =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(texte);

    } catch (e) {

      throw new Error(
        "La réponse du serveur n'est pas un JSON valide."
      );
    }


    if (!response.ok) {

      throw new Error(
        valeurTexte(
          data.message ||
          data.error ||
          texte,
          "Erreur du serveur."
        )
      );
    }


    if (
      data.ok === false
    ) {

      throw new Error(
        valeurTexte(
          data.message ||
          data.error,
          "La recherche a échoué."
        )
      );
    }


    afficherReponse(data);

    masquerStatus();

  } catch (error) {

    console.error(error);

    afficherStatus(
      error.message ||
      "Une erreur est survenue pendant la recherche.",
      "error"
    );

  } finally {

    bouton.disabled = false;
  }
}


async function envoyerPV() {

  const fichier =
    document.getElementById("fichierPV").files[0];

  const resultat =
    document.getElementById("uploadResult");

  const bouton =
    document.getElementById("btnUpload");


  if (!fichier) {

    resultat.textContent =
      "Veuillez sélectionner un fichier.";

    return;
  }


  bouton.disabled = true;

  resultat.textContent =
    "Envoi du PV en cours...";


  try {

    const formData =
      new FormData();

    formData.append(
      "file",
      fichier
    );


    const response =
      await fetch(
        UPLOAD_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const texte =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(texte);

    } catch (e) {

      throw new Error(
        "La réponse du serveur n'est pas un JSON valide."
      );
    }


    if (!response.ok) {

      throw new Error(
        valeurTexte(
          data.message ||
          data.error ||
          texte,
          "Erreur pendant l'envoi du PV."
        )
      );
    }


    resultat.textContent =
      valeurTexte(
        data.message ||
        data.reponse ||
        "PV envoyé avec succès."
      );

  } catch (error) {

    console.error(error);

    resultat.textContent =
      error.message ||
      "Erreur pendant l'envoi du PV.";

  } finally {

    bouton.disabled = false;
  }
}
