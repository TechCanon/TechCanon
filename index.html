<body>

<div class="container">

  <h1>TechCanon</h1>

  <label for="modele">Modèle</label>

  <select id="modele">
    <option value="C1538P">C1538P</option>
    <option value="C1533P">C1533P</option>
    <option value="LBP1538C">LBP1538C</option>
  </select>

  <label for="question">Question / problème</label>

  <textarea
    id="question"
    placeholder="Exemple : DEMONTER DC CONTROLLER PCB"
  ></textarea>

  <button id="bouton" onclick="rechercher()">
    Rechercher
  </button>

  <div id="resultat">
    Prêt.
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";


async function rechercher() {

  const bouton = document.getElementById("bouton");
  const resultat = document.getElementById("resultat");

  const modele = document.getElementById("modele").value;
  const question = document.getElementById("question").value.trim();

  if (!question) {
    resultat.className = "erreur";
    resultat.textContent = "Veuillez entrer une question.";
    return;
  }

  bouton.disabled = true;
  bouton.textContent = "Recherche...";

  resultat.className = "";
  resultat.textContent = "Recherche dans les manuels Canon...";

  try {

    const reponse = await fetch(SUPABASE_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        modele: modele,
        question: question
      })

    });

    const texte = await reponse.text();

    let data;

    try {
      data = JSON.parse(texte);
    } catch (e) {
      throw new Error(
        "Réponse Supabase invalide : " + texte
      );
    }

    if (!reponse.ok) {
      throw new Error(
        data.message || "Erreur Supabase HTTP " + reponse.status
      );
    }

    if (data.status === "error") {
      throw new Error(
        data.message || "Erreur inconnue de TechCanon"
      );
    }

    afficherResultat(data);

  } catch (erreur) {

    console.error(erreur);

    resultat.className = "erreur";

    resultat.textContent =
      "Impossible de contacter TechCanon.\n\n" +
      "Détail : " +
      erreur.message;

  } finally {

    bouton.disabled = false;
    bouton.textContent = "Rechercher";

  }
}


function afficherResultat(data) {

  const resultat = document.getElementById("resultat");

  resultat.className = "ok";

  let html = "";

  if (data.type) {
    html += "<strong>Type :</strong> "
      + data.type + "<br><br>";
  }

  if (data.composant) {
    html += "<strong>Composant :</strong> "
      + data.composant + "<br>";
  }

  if (data.unite) {
    html += "<strong>Unité :</strong> "
      + data.unite + "<br>";
  }

  if (data.procedure) {

    if (data.procedure.titre) {
      html += "<strong>Procédure :</strong> "
        + data.procedure.titre + "<br>";
    }

    if (data.procedure.page_manuel) {
      html += "<strong>Page manuel :</strong> "
        + data.procedure.page_manuel + "<br>";
    }

    if (data.procedure.page_pdf) {
      html += "<strong>Page PDF :</strong> "
        + data.procedure.page_pdf + "<br>";
    }
  }

  if (data.document) {

    html += "<br><strong>Document :</strong> "
      + (data.document.titre || "") + "<br>";

    if (data.document.fichier) {
      html += data.document.fichier + "<br>";
    }
  }

  if (data.message) {

    html += "<br><strong>Message :</strong><br>"
      + escapeHtml(data.message);
  }

  if (data.reponse) {

    html += "<br><br><strong>Réponse :</strong><br>"
      + escapeHtml(
          typeof data.reponse === "string"
            ? data.reponse
            : JSON.stringify(data.reponse, null, 2)
        );
  }

  if (data.image_url) {

    html += "<br><br>"
      + "<strong>Illustration :</strong><br>"
      + "<img src=\""
      + escapeAttribute(data.image_url)
      + "\" alt=\"Illustration de la procédure\">";

  }

  if (data.sources && Array.isArray(data.sources)) {

    html += "<br><br><strong>Sources :</strong><br>";

    for (const source of data.sources) {

      html +=
        "Page PDF "
        + (source.page_pdf || "")
        + " — "
        + escapeHtml(source.titre || "")
        + "<br>";
    }
  }

  if (!html) {

    html =
      "<strong>Réponse reçue :</strong><br>" +
      escapeHtml(
        JSON.stringify(data, null, 2)
      );
  }

  resultat.innerHTML = html;
}


function escapeHtml(texte) {

  return String(texte)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttribute(texte) {

  return String(texte)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

</script>

</body>
</html>
