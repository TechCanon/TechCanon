<!DOCTYPE html>
<html lang="fr">

  <style>
    :root {
      --canon-red: #c8102e;
      --canon-red-dark: #a50d25;
      --canon-red-light: #fff1f3;

      --background: #f4f6f8;

      --text: #18212b;
      --text-soft: #647180;
      --border: #dfe5eb;

      --shadow: 0 8px 25px rgba(15, 23, 42, 0.07);

    }

    * {

    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea {

    }

    .topbar {
      width: 100%;
      background: var(--canon-red);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 12px;

      font-weight: 900;

    .brand-text {
      min-width: 0;

    .brand-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;

      margin: 3px 0 0;

      opacity: 0.88;
    }

    .manual-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;

      letter-spacing: -0.6px;

    .intro p {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.6;
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 26px;
    }

    .search-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .search-card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .search-card-description {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .search-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 12px;
      font-weight: 800;
      color: #3c4854;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #cfd7df;
      border-radius: 10px;
      outline: none;
      background: #ffffff;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus {
      border-color: var(--canon-red);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
    }

    .question-field {
      min-width: 0;

    .search-actions {

      justify-content: flex-end;
      margin-top: 18px;
    }

      background: var(--canon-red);
      color: #ffffff;
      min-height: 46px;
      padding: 0 20px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .primary-button:hover {
      background: var(--canon-red-dark);
    }

    .primary-button:active {
      transform: translateY(1px);
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      color: var(--text-soft);
      font-size: 14px;
    }

    .status.visible {
      display: flex;
    }

    .status-spinner {
      width: 17px;
      height: 17px;
      border: 2px solid #e3e7eb;
      border-top-color: var(--canon-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #resultat {
      display: none;
    }

    #resultat.visible {
      display: block;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .result-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .result-title-wrap {
      min-width: 0;
    }

    .result-kicker {
      color: var(--canon-red);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;

      margin-bottom: 6px;

    .result-title {

    }

      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .result-body {
      padding: 24px;
    }

    .answer-text {
      margin: 0;

      line-height: 1.7;
    }

    .section {
      margin-top: 26px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 17px;
      font-weight: 850;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 22px;
      border-radius: 999px;
      background: var(--canon-red);
      flex-shrink: 0;
    }

    .section-subtitle {
      margin: -5px 0 14px 14px;
      color: var(--text-soft);
      font-size: 13px;
    }

    .identification-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .info-box {

    .info-value {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      word-break: break-word;
    }

    .manual-pages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .manual-page-card {
      border: 1px solid var(--border);

    }

      margin: 0 0 8px;

    .journey-source {

    .step-image {
      border-top: 1px solid var(--border);
