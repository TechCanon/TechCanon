<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechCanon</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 16px;
  background: #f4f4f4;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

select,
textarea,
input[type="file"],
button {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 12px;
}

select,
textarea,
input[type="file"] {
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.status {
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
  white-space: pre-wrap;
  word-break: break-word;
}

.success {
  background: #e8f7e8;
  color: #146214;
}

.error {
  background: #ffe8e8;
  color: #8b0000;
}

.step {
  margin-top: 16px;
}

.step img {
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  border-radius: 8px;
  background: #eee;
}

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.navigation button {
  flex: 1;
}

.small {
  font-size: 13px;
  color: #666;
}
</style>

</head>

<body>

<div class="container">

<h1>🛠️ TechCanon</h1>

<div class="card">

<label for="modele">Modèle</label>

<select id="modele">
  <option value="C1538P">C1538P</option>
  <option value="C1533P">C1533P</option>
  <option value="LBP1538C">LBP1538C</option>
</select>

<label for="question">Question</label>

<textarea
  id="question"
  placeholder="Exemple : démonter la carte de contrôleur CC UN2"
></textarea>

<button id="searchButton" type="button" onclick="rechercher()">
🔎 Rechercher
</button>

<div id="searchStatus"></div>

</div>

<div class="card">

<h2>📎 Ajouter un PV d'intervention</h2>

<p class="small">
Sélectionne un PDF depuis ton téléphone puis envoie-le à TechCanon.
</p>

<input
id="pvFile"
type="file"
accept="application/pdf,.pdf"

>

<button
id="pvButton"
type="button"
onclick="envoyerPV()"

>

📤 Envoyer le PV </button>

<div id="pvStatus"></div>

</div>

<div id="resultCard" class="card" style="display:none;">

<h2>📋 Résultat</h2>

<div id="result"></div>

<div id="stepContainer"></div>

<div class="navigation">

<button
id="previousButton"
type="button"
onclick="precedent()"

>

← Précédent </button>

<button
id="nextButton"
type="button"
onclick="suivant()"

>

Suivant → </button>

</div>

</div>

</div>

<script>

const ANSWER_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";

const UPLOAD_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/upload-pv";

let procedureSteps = [];
let currentStep = 0;


/* =========================
   OUTILS
========================= */

function afficherStatus(elementId, message, type) {

  const element =
    document.getElementById(elementId);

  element.className =
    "status " + (type || "");

  element.textContent =
    message;
}


/* =========================
   RECHERCHE MANUEL
========================= */

async function rechercher() {

  const modele =
    document.getElementById("modele").value;

  const question =
    document.getElementById("question").value.trim();

  const button =
    document.getElementById("searchButton");

  if (!question) {

    afficherStatus(
      "searchStatus",
      "Écris une question.",
      "error"
    );

    return;
  }

  button.disabled = true;

  afficherStatus(
    "searchStatus",
    "Recherche en cours...",
    ""
  );

  try {

    const response =
      await fetch(
        ANSWER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            modele: modele,
            question: question
          })
        }
      );

    const text =
      await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error(
        "Réponse serveur invalide : " +
        text
      );
    }

    if (!response.ok) {

      throw new Error(
        data.erreur ||
        data.error ||
        "Erreur serveur HTTP " +
        response.status
      );
    }

    if (!data.ok) {

      throw new Error(
        data.erreur ||
        "La recherche a échoué."
      );
    }

    afficherStatus(
      "searchStatus",
      "Recherche terminée.",
      "success"
    );

    afficherResultat(
      data.reponse
    );

  } catch (error) {

    console.error(error);

    afficherStatus(
      "searchStatus",
      "Erreur : " +
      (error.message || error),
      "error"
    );

  } finally {

    button.disabled = false;
  }
}


/* =========================
   AFFICHAGE RESULTAT
========================= */

function afficherResultat(reponse) {

  const card =
    document.getElementById("resultCard");

  const result =
    document.getElementById("result");

  card.style.display = "block";

  procedureSteps = [];
  currentStep = 0;

  if (!reponse) {

    result.textContent =
      "Aucune réponse.";

    return;
  }

  result.innerHTML = "";

  if (reponse.type === "PROCEDURE") {

    if (reponse.titre) {

      const title =
        document.createElement("h3");

      title.textContent =
        reponse.titre;

      result.appendChild(title);
    }

    if (reponse.avertissement) {

      const warning =
        document.createElement("div");

      warning.className =
        "status error";

      warning.textContent =
        reponse.avertissement;

      result.appendChild(warning);
    }

    procedureSteps =
      reponse.etapes ||
      reponse.steps ||
      [];

    afficherEtape();

    return;
  }

  if (reponse.reponse) {

    result.textContent =
      reponse.reponse;

  } else if (reponse.contenu) {

    result.textContent =
      reponse.contenu;

  } else {

    result.textContent =
      JSON.stringify(
        reponse,
        null,
        2
      );
  }

  document.getElementById(
    "stepContainer"
  ).innerHTML = "";

  document.getElementById(
    "previousButton"
  ).style.display = "none";

  document.getElementById(
    "nextButton"
  ).style.display = "none";
}


/* =========================
   ETAPES PROCEDURE
========================= */

function afficherEtape() {

  const container =
    document.getElementById(
      "stepContainer"
    );

  container.innerHTML = "";

  if (
    !procedureSteps ||
    procedureSteps.length === 0
  ) {

    container.textContent =
      "Aucune étape détaillée disponible.";

    return;
  }

  const step =
    procedureSteps[currentStep];

  const box =
    document.createElement("div");

  box.className = "step";

  const title =
    document.createElement("h3");

  title.textContent =
    step.titre ||
    step.title ||
    "Étape " +
    (currentStep + 1);

  box.appendChild(title);

  if (step.description) {

    const description =
      document.createElement("p");

    description.textContent =
      step.description;

    box.appendChild(description);
  }

  if (step.texte) {

    const texte =
      document.createElement("p");

    texte.textContent =
      step.texte;

    box.appendChild(texte);
  }

  if (step.page) {

    const page =
      document.createElement("p");

    page.className = "small";

    page.textContent =
      "Page : " +
      step.page;

    box.appendChild(page);
  }

  if (step.pdf_page) {

    const pdfPage =
      document.createElement("p");

    pdfPage.className = "small";

    pdfPage.textContent =
      "Page PDF : " +
      step.pdf_page;

    box.appendChild(pdfPage);
  }

  if (step.image) {

    const image =
      document.createElement("img");

    image.src =
      step.image;

    image.alt =
      "Illustration étape " +
      (currentStep + 1);

    image.loading =
      "lazy";

    box.appendChild(image);
  }

  container.appendChild(box);

  const previous =
    document.getElementById(
      "previousButton"
    );

  const next =
    document.getElementById(
      "nextButton"
    );

  previous.style.display =
    currentStep > 0
      ? "block"
      : "none";

  next.style.display =
    currentStep <
    procedureSteps.length - 1
      ? "block"
      : "none";
}


function precedent() {

  if (currentStep > 0) {

    currentStep--;

    afficherEtape();
  }
}


function suivant() {

  if (
    currentStep <
    procedureSteps.length - 1
  ) {

    currentStep++;

    afficherEtape();
  }
}


/* =========================
   UPLOAD PV
========================= */

async function envoyerPV() {

  const input =
    document.getElementById(
      "pvFile"
    );

  const button =
    document.getElementById(
      "pvButton"
    );

  const fichier =
    input.files &&
    input.files[0];

  if (!fichier) {

    afficherStatus(
      "pvStatus",
      "Sélectionne d'abord un fichier PDF.",
      "error"
    );

    return;
  }

  if (
    fichier.type !== "application/pdf" &&
    !fichier.name
      .toLowerCase()
      .endsWith(".pdf")
  ) {

    afficherStatus(
      "pvStatus",
      "Le fichier doit être un PDF.",
      "error"
    );

    return;
  }

  if (
    fichier.size >
    25 * 1024 * 1024
  ) {

    afficherStatus(
      "pvStatus",
      "Le PDF dépasse la limite de 25 Mo.",
      "error"
    );

    return;
  }

  button.disabled = true;

  afficherStatus(
    "pvStatus",
    "📤 Envoi du PV en cours...",
    ""
  );

  try {

    const response =
      await fetch(
        UPLOAD_URL,
        {
          method: "POST",

          mode: "cors",

          headers: {
            "Content-Type":
              "application/pdf",

            "x-filename":
              fichier.name
          },

          body: fichier
        }
      );

    const text =
      await response.text();

    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      throw new Error(
        "Réponse serveur invalide : " +
        text
      );
    }

    if (!response.ok) {

      throw new Error(
        data.erreur ||
        data.error ||
        "Erreur HTTP " +
        response.status
      );
    }

    if (!data.ok) {

      throw new Error(
        data.erreur ||
        "Le serveur a refusé le PV."
      );
    }

    afficherStatus(
      "pvStatus",
      "✅ PV envoyé avec succès.",
      "success"
    );

    input.value = "";

  } catch (error) {

    console.error(
      "Erreur upload PV:",
      error
    );

    let message =
      error &&
      error.message
        ? error.message
        : String(error);

    if (
      message ===
      "Failed to fetch"
    ) {

      message =
        "Connexion impossible avec le serveur Supabase. " +
        "Vérifie la connexion Internet du téléphone puis réessaie.";
    }

    afficherStatus(
      "pvStatus",
      "❌ " + message,
      "error"
    );

  } finally {

    button.disabled = false;
  }
}

</script>

</body>
</html>
