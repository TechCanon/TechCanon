<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechCanon</title>

  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #202124;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ---------- En-tete ---------- */
    header {
      background: #111827;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 2px 0 0; color: #cbd5e1; font-size: 12px; }

    .btn-secondaire {
      background: transparent;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ---------- Barre du modele ---------- */
    .barre-modele {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .barre-modele label { font-weight: bold; font-size: 14px; }
    .barre-modele select {
      flex: 1;
      max-width: 320px;
      font-size: 16px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
    }

    /* ---------- Conversation ---------- */
    #chat {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 12px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .msg { margin-bottom: 14px; display: flex; }
    .msg.moi { justify-content: flex-end; }

    .bulle {
      max-width: 92%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 15px;
      word-wrap: break-word;
    }
    .msg.moi .bulle { background: #111827; color: white; border-bottom-right-radius: 4px; }
    .msg.agent .bulle {
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    .attente { color: #64748b; font-style: italic; }

    .exemples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .exemple {
      background: #eef2ff;
      color: #1e3a8a;
      border: 1px solid #c7d2fe;
      border-radius: 16px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .badge.documente { background: #dcfce7; color: #166534; }
    .badge.partiel { background: #fef3c7; color: #92400e; }
    .badge.non_trouve { background: #e2e8f0; color: #334155; }

    .titre-bloc {
      font-weight: bold;
      font-size: 13px;
      color: #475569;
      margin: 14px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Sections de la procedure (dans l'ordre a suivre) */
    .section {
      border-left: 4px solid #94a3b8;
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 12px;
    }
    .section.prealable { border-left-color: #f59e0b; background: #fffbeb; }
    .section.principale { border-left-color: #2563eb; background: #eff6ff; }
    .section.repose { border-left-color: #16a34a; background: #f0fdf4; }

    .section-entete { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .section-num {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111827;
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-titre { font-weight: bold; font-size: 15px; }
    .section-sous { font-size: 12px; color: #64748b; margin-top: 2px; }
    .note { font-size: 14px; color: #64748b; margin-bottom: 8px; }

    /* Etapes numerotees */
    ol.etapes { list-style: none; counter-reset: etape; margin: 0; padding: 0; }
    ol.etapes li {
      counter-increment: etape;
      position: relative;
      padding-left: 36px;
      margin-bottom: 14px;
    }
    ol.etapes li::before {
      content: counter(etape);
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #cbd5e1;
      color: #0f172a;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pieces */
    .tableau-defile { overflow-x: auto; }
    table.pieces { border-collapse: collapse; width: 100%; font-size: 14px; }
    table.pieces th, table.pieces td {
      border: 1px solid #e2e8f0;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    table.pieces th { background: #f1f5f9; }
    .ref { font-family: Consolas, monospace; font-weight: bold; white-space: nowrap; }

    /* Avertissements */
    .avert {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 8px 10px;
      margin-top: 10px;
      font-size: 14px;
      border-radius: 6px;
    }

    /* Miniatures des pages */
    .miniatures { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .mini {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      width: 110px;
    }
    .mini img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      object-position: top;
      border-radius: 4px;
      display: block;
      background: #e2e8f0;
    }
    .mini span { display: block; font-size: 11px; color: #334155; margin-top: 3px; text-align: center; }
    .mini-absente {
      font-size: 12px;
      color: #64748b;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
    }

    .erreur {
      background: #fee2e2;
      color: #991b1b;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* ---------- Saisie ---------- */
    .saisie {
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 10px 12px;
      flex: 0 0 auto;
    }
    .saisie-interne {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #question {
      flex: 1;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      resize: none;
      max-height: 140px;
      font-family: inherit;
    }
    #envoyer {
      background: #111827;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      height: 44px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #envoyer:disabled { opacity: 0.5; cursor: wait; }

    /* ---------- PV ---------- */
    details.pv {
      max-width: 900px;
      margin: 8px auto 0;
      font-size: 14px;
    }
    details.pv summary { cursor: pointer; font-weight: bold; padding: 4px 0; }
    .pv-contenu { padding: 8px 0 2px; }
    .pv-contenu input[type="file"] {
      width: 100%;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      background: white;
    }
    #envoyerPV {
      width: 100%;
      margin-top: 8px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #envoyerPV:disabled { opacity: 0.5; cursor: wait; }
    #pvStatut { margin-top: 8px; }
    .ok { background: #dcfce7; color: #166534; padding: 9px 12px; border-radius: 8px; }

    /* ---------- Visionneuse ---------- */
    #visionneuse {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 50;
      flex-direction: column;
    }
    #visionneuse.ouverte { display: flex; }
    .vision-haut {
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 14px;
    }
    .vision-haut button {
      background: #334155;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .vision-zone { flex: 1; overflow: auto; text-align: center; }
    .vision-zone img { max-width: 100%; cursor: zoom-in; background: white; }
    .vision-zone img.zoom { max-width: none; width: 230%; cursor: zoom-out; }
  </style>
</head>

<body>

<header>
  <div>
    <h1>TechCanon</h1>
    <p>Assistant technique Canon</p>
  </div>
  <button class="btn-secondaire" id="nouvelle" type="button">Nouvelle conversation</button>
</header>

<div class="barre-modele">
  <label for="modele">Modèle</label>
  <select id="modele"></select>
</div>

<div id="chat"></div>

<div class="saisie">
  <div class="saisie-interne">
    <textarea id="question" rows="1"
      placeholder="Pose ta question : code erreur, pièce, procédure, symptôme..."></textarea>
    <button id="envoyer" type="button">Envoyer</button>
  </div>

  <details class="pv">
    <summary>Ajouter un PV d'intervention</summary>
    <div class="pv-contenu">
      <input id="pvFile" type="file" accept="application/pdf,.pdf">
      <button id="envoyerPV" type="button">Envoyer le PV</button>
      <div id="pvStatut"></div>
    </div>
  </details>
</div>

<div id="visionneuse">
  <div class="vision-haut">
    <span id="visionTitre"></span>
    <button id="visionFermer" type="button">Fermer</button>
  </div>
  <div class="vision-zone">
    <img id="visionImage" alt="Page du manuel">
  </div>
</div>


<script>
const ANSWER_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";

const UPLOAD_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/upload-pv";

const MODELES_SECOURS = ["C1538P", "C1533P", "LBP1538C"];

const EXEMPLES = [
  "Où se trouve la carte contrôleur principale ?",
  "Comment déposer la carte contrôleur CC ?",
  "Référence du capot arrière droit"
];

let historique = [];
let enCours = false;

const chat = document.getElementById("chat");
const champ = document.getElementById("question");
const boutonEnvoyer = document.getElementById("envoyer");
const selectModele = document.getElementById("modele");


/* =========================
   Utilitaires
   ========================= */

function el(balise, classe, texte) {
  const e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined && texte !== null) e.textContent = texte;
  return e;
}

function lireCode() {
  try { return localStorage.getItem("techcanon_code") || ""; }
  catch (e) { return ""; }
}

function ecrireCode(valeur) {
  try { localStorage.setItem("techcanon_code", valeur); }
  catch (e) { /* stockage indisponible */ }
}

// Ecrit du texte avec retours a la ligne et **gras**, sans jamais interpreter de HTML
function ajouterTexte(parent, texte) {
  const lignes = String(texte || "").split("\n");

  lignes.forEach((ligne, i) => {
    if (i > 0) parent.appendChild(document.createElement("br"));

    ligne.split(/(\*\*[^*]+\*\*)/g).forEach((morceau) => {
      if (!morceau) return;

      if (morceau.length > 4 && morceau.startsWith("**") && morceau.endsWith("**")) {
        parent.appendChild(el("strong", "", morceau.slice(2, -2)));
      } else {
        parent.appendChild(document.createTextNode(morceau));
      }
    });
  });
}

function defiler() {
  chat.scrollTop = chat.scrollHeight;
}

function ajuster() {
  champ.style.height = "auto";
  champ.style.height = Math.min(champ.scrollHeight, 140) + "px";
}


/* =========================
   Appel au serveur
   ========================= */

async function appeler(corps, essai) {
  const reponse = await fetch(ANSWER_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-access-code": lireCode()
    },
    body: JSON.stringify(corps)
  });

  if (reponse.status === 401 && !essai) {
    const saisi = prompt("Code d'accès TechCanon :");
    if (saisi) {
      ecrireCode(saisi.trim());
      return appeler(corps, true);
    }
  }

  return reponse;
}


/* =========================
   Menu des modeles
   ========================= */

async function chargerModeles() {
  let jetons = [];

  try {
    const reponse = await appeler({ action: "modeles" });
    const data = await reponse.json();

    if (data && data.ok && Array.isArray(data.modeles)) {
      const ensemble = new Set();
      data.modeles.forEach((m) => {
        String(m.modele || "").split("/").forEach((t) => {
          t = t.trim();
          if (t) ensemble.add(t);
        });
      });
      jetons = [...ensemble].sort();
    }
  } catch (erreur) {
    console.error("Liste des modèles indisponible :", erreur);
  }

  if (jetons.length === 0) jetons = MODELES_SECOURS;

  selectModele.innerHTML = "";
  jetons.forEach((nom) => {
    const option = document.createElement("option");
    option.value = nom;
    option.textContent = nom;
    selectModele.appendChild(option);
  });

  if (jetons.includes("C1538P")) selectModele.value = "C1538P";
}


/* =========================
   Affichage de la conversation
   ========================= */

function ajouterMessageUtilisateur(texte) {
  const ligne = el("div", "msg moi");
  ligne.appendChild(el("div", "bulle", texte));
  chat.appendChild(ligne);
  defiler();
}

function ajouterBulleAgent() {
  const ligne = el("div", "msg agent");
  const bulle = el("div", "bulle");
  ligne.appendChild(bulle);
  chat.appendChild(ligne);
  return { ligne, bulle };
}

function afficherAccueil() {
  chat.innerHTML = "";
  const { bulle } = ajouterBulleAgent();

  bulle.appendChild(el("div", "", "Bonjour. Choisis le modèle, puis pose ta question comme tu la dirais à un collègue : code erreur, symptôme, pièce à commander, procédure de dépose..."));
  bulle.appendChild(el("div", "", "Je cherche dans le Service Manual et le Parts Catalog, et j'affiche les pages du manuel avec la réponse."));
  bulle.lastChild.style.marginTop = "8px";

  const liste = el("div", "exemples");
  EXEMPLES.forEach((texte) => {
    const bouton = el("button", "exemple", texte);
    bouton.type = "button";
    bouton.addEventListener("click", () => {
      champ.value = texte;
      envoyer();
    });
    liste.appendChild(bouton);
  });
  bulle.appendChild(liste);
}

function afficherErreur(message) {
  const ligne = el("div", "msg agent");
  ligne.appendChild(el("div", "erreur", "Erreur : " + message));
  chat.appendChild(ligne);
  defiler();
}

function creerMiniature(source) {
  if (!source.image_url) {
    return el("div", "mini-absente",
      source.document + " p." + source.page + " (image indisponible)");
  }

  const bouton = el("button", "mini");
  bouton.type = "button";

  const image = document.createElement("img");
  image.src = source.image_url;
  image.loading = "lazy";
  image.alt = source.document + " page " + source.page;

  bouton.appendChild(image);
  bouton.appendChild(el("span", "", source.document + " · p." + source.page));
  bouton.addEventListener("click", () => ouvrirVisionneuse(source));

  return bouton;
}

function creerMiniatures(sources) {
  const conteneur = el("div", "miniatures");
  sources.forEach((s) => conteneur.appendChild(creerMiniature(s)));
  return conteneur;
}

function creerListeEtapes(etapes, parId, dejaMontrees) {
  const liste = el("ol", "etapes");

  etapes.forEach((etape) => {
    const item = el("li");
    const contenu = el("div");
    ajouterTexte(contenu, etape.texte);
    item.appendChild(contenu);

    const sourcesEtape = (etape.sources || [])
      .map((id) => parId[id])
      .filter(Boolean);

    if (sourcesEtape.length > 0) {
      sourcesEtape.forEach((s) => dejaMontrees.add(s.id));
      item.appendChild(creerMiniatures(sourcesEtape));
    }

    liste.appendChild(item);
  });

  return liste;
}

function creerSection(numero, titre, classe, sousTitre) {
  const section = el("div", "section " + classe);
  const entete = el("div", "section-entete");

  if (numero) entete.appendChild(el("span", "section-num", String(numero)));

  const titres = el("div");
  titres.appendChild(el("div", "section-titre", titre));
  if (sousTitre) titres.appendChild(el("div", "section-sous", sousTitre));
  entete.appendChild(titres);

  section.appendChild(entete);
  return section;
}

function afficherReponse(data) {
  const { ligne, bulle } = ajouterBulleAgent();
  const sources = Array.isArray(data.sources) ? data.sources : [];
  const parId = {};
  sources.forEach((s) => { parId[s.id] = s; });

  const etiquettes = {
    documente: "Documenté dans le manuel",
    partiel: "Réponse partielle",
    non_trouve: "Non trouvé dans la documentation"
  };
  const confiance = etiquettes[data.confiance] ? data.confiance : "partiel";
  bulle.appendChild(el("span", "badge " + confiance, etiquettes[confiance]));

  const texte = el("div");
  ajouterTexte(texte, data.reponse);
  bulle.appendChild(texte);

  // Precautions : avant toute etape
  (data.avertissements || []).forEach((texteAvert) => {
    const boite = el("div", "avert");
    ajouterTexte(boite, "⚠ " + texteAvert);
    bulle.appendChild(boite);
  });

  const dejaMontrees = new Set();
  const prealables = Array.isArray(data.prealables) ? data.prealables : [];
  const etapes = Array.isArray(data.etapes) ? data.etapes : [];

  // Les sections sont numerotees dans l'ordre a suivre
  const total = prealables.length + (etapes.length > 0 ? 1 : 0);
  let compteur = 0;
  const numeroSuivant = () => (total > 1 ? ++compteur : 0);

  // 1) Operations preliminaires
  prealables.forEach((pre) => {
    const section = creerSection(
      numeroSuivant(),
      "Préalable : " + pre.nom,
      "prealable",
      pre.raison
    );

    if (pre.trouve && Array.isArray(pre.etapes) && pre.etapes.length > 0) {
      section.appendChild(creerListeEtapes(pre.etapes, parId, dejaMontrees));
    } else {
      section.appendChild(el("div", "note",
        pre.note || "Procédure non trouvée dans les pages consultées."));

      const bouton = el("button", "exemple", "Chercher : " + pre.nom);
      bouton.type = "button";
      bouton.addEventListener("click", () => {
        champ.value = "Comment faire : " + pre.nom + " ?";
        envoyer();
      });
      section.appendChild(bouton);
    }

    bulle.appendChild(section);
  });

  // 2) Operation demandee
  if (etapes.length > 0) {
    const section = creerSection(
      numeroSuivant(),
      data.titre || "Procédure",
      "principale"
    );
    section.appendChild(creerListeEtapes(etapes, parId, dejaMontrees));
    bulle.appendChild(section);
  }

  // 3) Repose
  if (data.repose) {
    const section = creerSection(0, "Repose", "repose");
    const contenu = el("div");
    ajouterTexte(contenu, data.repose);
    section.appendChild(contenu);
    bulle.appendChild(section);
  }

  // Pieces
  if (Array.isArray(data.pieces) && data.pieces.length > 0) {
    bulle.appendChild(el("div", "titre-bloc", "Pièces"));

    const defile = el("div", "tableau-defile");
    const tableau = el("table", "pieces");

    const entete = el("tr");
    ["Référence", "Désignation", "Qté", "Page"].forEach((t) => {
      entete.appendChild(el("th", "", t));
    });
    tableau.appendChild(entete);

    data.pieces.forEach((piece) => {
      const ligneTableau = el("tr");
      ligneTableau.appendChild(el("td", "ref", piece.reference));
      ligneTableau.appendChild(el("td", "", piece.designation));
      ligneTableau.appendChild(el("td", "", piece.quantite));

      const cellule = el("td");
      const source = piece.source ? parId[piece.source] : null;

      if (source) {
        dejaMontrees.add(source.id);
        const lien = el("button", "exemple", "p." + source.page);
        lien.type = "button";
        lien.addEventListener("click", () => ouvrirVisionneuse(source));
        cellule.appendChild(lien);
      }

      ligneTableau.appendChild(cellule);
      tableau.appendChild(ligneTableau);
    });

    defile.appendChild(tableau);
    bulle.appendChild(defile);
  }

  // Pages du manuel non deja montrees dans les etapes
  const restantes = sources.filter((s) => !dejaMontrees.has(s.id));

  if (restantes.length > 0) {
    bulle.appendChild(el("div", "titre-bloc", "Pages du manuel"));
    bulle.appendChild(creerMiniatures(restantes));
  }

  // On montre le debut de la reponse, pas la fin
  ligne.scrollIntoView({ block: "start" });
}

function resumePourHistorique(data) {
  let texte = "";

  if (data.titre) texte += data.titre + ". ";
  texte += String(data.reponse || "");

  if (Array.isArray(data.prealables) && data.prealables.length > 0) {
    texte += "\nPreliminaires : " + data.prealables.map((p) => p.nom).join(" | ");
  }
  if (Array.isArray(data.etapes) && data.etapes.length > 0) {
    texte += "\nEtapes : " + data.etapes.map((e) => e.texte).join(" | ");
  }
  if (Array.isArray(data.pieces) && data.pieces.length > 0) {
    texte += "\nPieces : " + data.pieces
      .map((p) => p.reference + " " + p.designation).join(" | ");
  }
  return texte.slice(0, 1500);
}


/* =========================
   Envoi d'une question
   ========================= */

async function envoyer() {
  if (enCours) return;

  const question = champ.value.trim();
  if (!question) return;

  const modele = selectModele.value;

  ajouterMessageUtilisateur(question);
  champ.value = "";
  ajuster();

  const attente = ajouterBulleAgent();
  attente.bulle.appendChild(el("span", "attente",
    "Recherche dans le Service Manual et le Parts Catalog..."));
  defiler();

  enCours = true;
  boutonEnvoyer.disabled = true;

  try {
    const reponse = await appeler({
      modele: modele,
      question: question,
      historique: historique.slice(-6)
    });

    let data = null;
    try { data = await reponse.json(); } catch (e) { /* reponse illisible */ }

    if (!reponse.ok || !data || !data.ok) {
      throw new Error((data && data.erreur) || ("Erreur serveur " + reponse.status));
    }

    attente.ligne.remove();
    afficherReponse(data);

    historique.push({ role: "user", content: question });
    historique.push({ role: "assistant", content: resumePourHistorique(data) });

  } catch (erreur) {
    console.error(erreur);
    attente.ligne.remove();
    afficherErreur(erreur.message);
  } finally {
    enCours = false;
    boutonEnvoyer.disabled = false;
    champ.focus();
  }
}

boutonEnvoyer.addEventListener("click", envoyer);

champ.addEventListener("input", ajuster);

champ.addEventListener("keydown", (evenement) => {
  if (evenement.key === "Enter" && (evenement.ctrlKey || evenement.metaKey)) {
    evenement.preventDefault();
    envoyer();
  }
});

document.getElementById("nouvelle").addEventListener("click", () => {
  historique = [];
  afficherAccueil();
});

selectModele.addEventListener("change", () => {
  historique = [];
  afficherAccueil();
});


/* =========================
   Visionneuse de pages
   ========================= */

const visionneuse = document.getElementById("visionneuse");
const visionImage = document.getElementById("visionImage");

function ouvrirVisionneuse(source) {
  document.getElementById("visionTitre").textContent =
    source.document + " — page " + source.page;
  visionImage.className = "";
  visionImage.src = source.image_url;
  visionneuse.classList.add("ouverte");
}

function fermerVisionneuse() {
  visionneuse.classList.remove("ouverte");
  visionImage.removeAttribute("src");
}

visionImage.addEventListener("click", () => {
  visionImage.classList.toggle("zoom");
});

document.getElementById("visionFermer")
  .addEventListener("click", fermerVisionneuse);

document.addEventListener("keydown", (evenement) => {
  if (evenement.key === "Escape") fermerVisionneuse();
});


/* =========================
   Envoi d'un PV
   ========================= */

function nomFichierSecurise(nom) {
  return nom
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9._-]/g, "_");
}

async function envoyerPV() {
  const zone = document.getElementById("pvFile");
  const statut = document.getElementById("pvStatut");
  const bouton = document.getElementById("envoyerPV");
  const fichier = zone.files && zone.files[0];

  statut.innerHTML = "";

  if (!fichier) {
    statut.appendChild(el("div", "erreur", "Sélectionne d'abord un PDF."));
    return;
  }

  if (fichier.type !== "application/pdf" &&
      !fichier.name.toLowerCase().endsWith(".pdf")) {
    statut.appendChild(el("div", "erreur", "Le fichier doit être un PDF."));
    return;
  }

  bouton.disabled = true;
  statut.textContent = "Envoi du PV en cours...";

  try {
    const reponse = await fetch(UPLOAD_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/pdf",
        "x-filename": nomFichierSecurise(fichier.name)
      },
      body: fichier
    });

    const data = await reponse.json().catch(() => null);

    if (!reponse.ok || !data || !data.ok) {
      throw new Error((data && (data.detail || data.erreur)) || ("Erreur serveur " + reponse.status));
    }

    statut.innerHTML = "";
    statut.appendChild(el("div", "ok", "PV enregistré : " + fichier.name));
    zone.value = "";

  } catch (erreur) {
    console.error(erreur);
    statut.innerHTML = "";
    statut.appendChild(el("div", "erreur", "Envoi impossible : " + erreur.message));
  } finally {
    bouton.disabled = false;
  }
}

document.getElementById("envoyerPV").addEventListener("click", envoyerPV);

chargerModeles();
