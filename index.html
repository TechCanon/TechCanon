<script>

const ANSWER_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/answer-manual";

const UPLOAD_URL =
  "https://cfctnozhiyusrcxglalw.supabase.co/functions/v1/upload-pv";


/* =========================================================
   UTILITAIRES
   ========================================================= */

function valeurTexte(valeur) {

  if (valeur === null || valeur === undefined) {
    return "";
  }

  if (
    typeof valeur === "string" ||
    typeof valeur === "number" ||
    typeof valeur === "boolean"
  ) {
    return String(valeur);
  }

  if (Array.isArray(valeur)) {
    return valeur
      .map(item => valeurTexte(item))
      .filter(Boolean)
      .join("\n");
  }

  if (typeof valeur === "object") {

    const priorites = [
      "texte",
      "text",
      "message",
      "answer",
      "reponse",
      "contenu",
      "content",
      "description",
      "procedure",
      "instruction",
      "intention",
      "localisation",
      "reference"
    ];

    for (const cle of priorites) {
      if (
        Object.prototype.hasOwnProperty.call(valeur, cle) &&
        valeur[cle] !== null &&
        valeur[cle] !== undefined
      ) {
        const texte = valeurTexte(valeur[cle]);

        if (texte) {
          return texte;
        }
      }
    }

    try {
      return JSON.stringify(valeur, null, 2);
    } catch (e) {
      return "";
    }
  }

  return String(valeur);
}


function echapperHTML(texte) {

  return String(texte)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function afficherTexte(texte) {

  if (!texte) {
    return "";
  }

  return echapperHTML(texte)
    .replace(/\r\n/g, "\n")
    .replace(/\n/g, "<br>");
}


function chercherPremier(objet, cles) {

  if (!objet || typeof objet !== "object") {
    return null;
  }

  for (const cle of cles) {

    if (
      Object.prototype.hasOwnProperty.call(objet, cle) &&
      objet[cle] !== null &&
      objet[cle] !== undefined &&
      objet[cle] !== ""
    ) {
      return objet[cle];
    }
  }

  return null;
}


/* =========================================================
   QUESTION
   ========================================================= */

async function poserQuestion() {

  const model = document.getElementById("model").value;
  const question = document.getElementById("question").value.trim();

  const resultCard = document.getElementById("resultCard");
  const result = document.getElementById("result");
  const loading = document.getElementById("loading");

  if (!question) {

    resultCard.classList.remove("hidden");

    result.innerHTML = `
      <div class="error">
        Veuillez saisir une question technique.
      </div>
    `;

    return;
  }

  loading.style.display = "block";
  resultCard.classList.add("hidden");
  result.innerHTML = "";

  try {

    const response = await fetch(ANSWER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        model: model,
        question: question
      })

    });


    const texteBrut = await response.text();

    let data;

    try {
      data = JSON.parse(texteBrut);
    } catch (e) {

      throw new Error(
        "Réponse serveur non JSON : " + texteBrut
      );

    }


    if (!response.ok) {

      const messageErreur =
        valeurTexte(
          chercherPremier(data, [
            "error",
            "message",
            "detail"
          ])
        ) || "Erreur serveur";

      throw new Error(messageErreur);
    }


    afficherReponse(data);

  } catch (error) {

    resultCard.classList.remove("hidden");

    result.innerHTML = `
      <div class="error">
        <strong>Erreur :</strong><br>
        ${afficherTexte(error.message)}
      </div>
    `;

  } finally {

    loading.style.display = "none";

  }

}


/* =========================================================
   AFFICHAGE REPONSE
   ========================================================= */

function afficherReponse(data) {

  const resultCard = document.getElementById("resultCard");
  const result = document.getElementById("result");

  resultCard.classList.remove("hidden");


  if (!data || typeof data !== "object") {

    result.innerHTML = `
      <div class="error">
        Réponse du serveur invalide.
      </div>
    `;

    return;
  }


  console.log("Réponse complète answer-manual :", data);


  const model =
    chercherPremier(data, [
      "model",
      "modele",
      "modèle"
    ]);


  const type =
    chercherPremier(data, [
      "type",
      "type_reponse",
      "response_type",
      "intention"
    ]);


  const texte =
    chercherPremier(data, [
      "reponse",
      "réponse",
      "answer",
      "message",
      "texte",
      "text",
      "content"
    ]);


  let html = `

    <div class="result-header">

      <h2>
        Résultats du Service Manual
      </h2>

      ${
        model
          ? `<div class="meta">
              Modèle :
              <strong>${afficherTexte(valeurTexte(model))}</strong>
             </div>`
          : ""
      }

      ${
        type
          ? `<div class="meta">
              Type de réponse :
              <strong>${afficherTexte(valeurTexte(type))}</strong>
             </div>`
          : ""
      }

    </div>

  `;


  /*
   * -------------------------------------------------------
   * REPONSE TECHNIQUE / PROCEDURE
   * -------------------------------------------------------
   */

  const estTechnique =
    data.type === "REPONSE_TECHNIQUE" ||
    data.type === "PROCEDURE" ||
    data.response_type === "REPONSE_TECHNIQUE" ||
    data.response_type === "PROCEDURE" ||
    typeof data.reponse === "object" ||
    typeof data.réponse === "object";


  if (estTechnique) {

    html += afficherReponseTechnique(data);

  }


  /*
   * -------------------------------------------------------
   * LOCALISATION
   * -------------------------------------------------------
   */

  const localisation =
    chercherPremier(data, [
      "localisation",
      "location",
      "position",
      "emplacement"
    ]);


  if (localisation) {

    html += `
      <div class="answer-box">

        <div class="answer-title">
          Localisation
        </div>

        <div>
          ${afficherTexte(valeurTexte(localisation))}
        </div>

      </div>
    `;

  }


  /*
   * -------------------------------------------------------
   * IDENTIFICATION
   * -------------------------------------------------------
   */

  const identification =
    chercherPremier(data, [
      "identification",
      "piece",
      "part",
      "component",
      "composant",
      "board",
      "carte"
    ]);


  if (identification) {

    html += `
      <div class="success">

        <strong>Élément identifié :</strong><br>

        ${afficherTexte(valeurTexte(identification))}

      </div>
    `;

  }


  /*
   * -------------------------------------------------------
   * REFERENCE PROCEDURE
   * -------------------------------------------------------
   */

  const reference =
    chercherPremier(data, [
      "reference",
      "référence",
      "procedure_reference",
      "procedureReference",
      "manuel_reference",
      "manual_reference"
    ]);


  if (reference) {

    html += `
      <div class="technical-section">

        <h3>
          Référence Service Manual
        </h3>

        <div class="answer-box">
          ${afficherTexte(valeurTexte(reference))}
        </div>

      </div>
    `;

  }


  /*
   * -------------------------------------------------------
   * AVERTISSEMENT
   * -------------------------------------------------------
   */

  const warning =
    chercherPremier(data, [
      "warning",
      "warnings",
      "avertissement",
      "attention",
      "precaution",
      "précaution"
    ]);


  if (warning) {

    html += `
      <div class="warning">

        <strong>Attention</strong><br>

        ${afficherTexte(valeurTexte(warning))}

      </div>
    `;

  }


  /*
   * -------------------------------------------------------
   * REPONSE GENERALE
   * -------------------------------------------------------
   */

  if (
    texte &&
    !(
      typeof texte === "object" &&
      texte === data.reponse
    )
  ) {

    const texteFinal = valeurTexte(texte);

    if (texteFinal) {

      html += `
        <div class="answer-box">

          <div class="answer-title">
            Réponse
          </div>

          <div>
            ${afficherTexte(texteFinal)}
          </div>

        </div>
      `;

    }

  }


  /*
   * -------------------------------------------------------
   * RESULTATS DE RECHERCHE
   * -------------------------------------------------------
   */

  const resultats =
    chercherPremier(data, [
      "results",
      "resultats",
      "résultats",
      "matches",
      "documents",
      "passages",
      "sources"
    ]);


  if (Array.isArray(resultats) && resultats.length > 0) {

    html += `
      <div class="technical-section">

        <h3>
          Passages du Service Manual
        </h3>
    `;


    resultats.forEach((item, index) => {

      if (typeof item === "object") {

        const contenu =
          chercherPremier(item, [
            "text",
            "texte",
            "content",
            "contenu",
            "page_content",
            "passage",
            "description"
          ]);

        const score =
          chercherPremier(item, [
            "score",
            "similarity",
            "distance"
          ]);

        const source =
          chercherPremier(item, [
            "source",
            "file",
            "filename",
            "document",
            "page"
          ]);


        html += `
          <div class="result-item">

            ${
              score !== null
                ? `<div class="score">
                    Pertinence :
                    ${afficherTexte(valeurTexte(score))}
                   </div>`
                : ""
            }

            ${
              source
                ? `<div>
                    <strong>
                      ${afficherTexte(valeurTexte(source))}
                    </strong>
                   </div>`
                : ""
            }

            <div>
              ${afficherTexte(
                valeurTexte(contenu || item)
              )}
            </div>

          </div>
        `;

      } else {

        html += `
          <div class="result-item">

            <div class="score">
              Résultat ${index + 1}
            </div>

            <div>
              ${afficherTexte(valeurTexte(item))}
            </div>

          </div>
        `;

      }

    });


    html += `
      </div>
    `;

  }


  /*
   * -------------------------------------------------------
   * FALLBACK
   * -------------------------------------------------------
   */

  if (
    !html.trim() ||
    html === `
    <div class="result-header">
    </div>
  `
  ) {

    html += `
      <div class="answer-box">

        <div class="answer-title">
          Résultat brut
        </div>

        <pre>${afficherTexte(
          JSON.stringify(data, null, 2)
        )}</pre>

```
  </div>
`;
```

}

html += `

    JSON.stringify(data, null, 2)
  )}</pre>

</details>
```

`;

result.innerHTML = html;

}
